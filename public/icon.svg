<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Aesthetic Girlish Pastel & Berry Gradients -->
    <radialGradient id="pinkBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fff0f5"/>
      <stop offset="45%" stop-color="#fce7f3"/>
      <stop offset="85%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </radialGradient>
    <linearGradient id="roseBerry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="pastelLavender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="50%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#pinkBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="6 8" opacity="0.6"/>

  <!-- Aesthetic Girlish Bow & Heart Stud -->
  <g transform="translate(256, 130)">
    <!-- Cute Bow Ribbons -->
    <path d="M-6,-2 C-26,-24 -52,-18 -48,8 C-44,28 -14,14 -4,4 Z" fill="url(#roseBerry)" />
    <path d="M6,-2 C26,-24 52,-18 48,8 C44,28 14,14 4,4 Z" fill="url(#roseBerry)" />
    <!-- Center Heart Knot -->
    <path d="M0,8 C-12,-4 -12,-16 0,-16 C12,-16 12,-4 0,8 Z" fill="#ffffff" filter="url(#softGlow)"/>
    <circle cx="0" cy="-6" r="5" fill="#f43f5e"/>
  </g>

  <!-- Dangle Loop -->
  <line x1="256" y1="145" x2="256" y2="185" stroke="#db2777" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="188" r="6" fill="#f472b6"/>

  <!-- Cute Aesthetic Jhumki Dome (Fluted & Scalloped) -->
  <path d="M176,260 C180,202 216,192 256,192 C296,192 332,202 336,260 C308,268 282,272 256,272 C230,272 204,268 176,260 Z" fill="url(#roseBerry)"/>

  <!-- Dome Cut-out Details -->
  <path d="M196,252 C204,218 228,206 256,206 C284,206 308,218 316,252" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <circle cx="256" cy="226" r="6" fill="#ffffff"/>
  <circle cx="230" cy="236" r="4" fill="#ffffff"/>
  <circle cx="282" cy="236" r="4" fill="#ffffff"/>

  <!-- Scallop Bottom Rim -->
  <line x1="176" y1="264" x2="336" y2="264" stroke="#be185d" stroke-width="4"/>

  <!-- Aesthetic Seed Pearls & Dangling Drops -->
  <g fill="#ffffff" stroke="#db2777" stroke-width="2">
    <circle cx="188" cy="292" r="7"/>
    <line x1="188" y1="266" x2="188" y2="285" stroke="#db2777" stroke-width="2.5"/>

    <circle cx="212" cy="304" r="8"/>
    <line x1="212" y1="268" x2="212" y2="296" stroke="#db2777" stroke-width="2.5"/>

    <circle cx="236" cy="314" r="9"/>
    <line x1="236" y1="270" x2="236" y2="305" stroke="#db2777" stroke-width="2.5"/>

    <!-- Center Blossom Pearl Drop -->
    <line x1="256" y1="272" x2="256" y2="324" stroke="#db2777" stroke-width="3"/>
    <circle cx="256" cy="336" r="12" fill="#ffffff" stroke="#ec4899" stroke-width="3"/>
    <circle cx="256" cy="336" r="5" fill="#f43f5e"/>

    <circle cx="276" cy="314" r="9"/>
    <line x1="276" y1="270" x2="276" y2="305" stroke="#db2777" stroke-width="2.5"/>

    <circle cx="300" cy="304" r="8"/>
    <line x1="300" y1="268" x2="300" y2="296" stroke="#db2777" stroke-width="2.5"/>

    <circle cx="324" cy="292" r="7"/>
    <line x1="324" y1="266" x2="324" y2="285" stroke="#db2777" stroke-width="2.5"/>
  </g>

  <!-- Gen-Z Y2K Sparkles -->
  <path d="M120,130 Q140,130 140,110 Q140,130 160,130 Q140,130 140,150 Q140,130 120,130 Z" fill="#ec4899"/>
  <path d="M370,160 Q385,160 385,145 Q385,160 400,160 Q385,160 385,175 Q385,160 370,160 Z" fill="#ec4899"/>
  <circle cx="360" cy="230" r="4" fill="#f472b6"/>
  <circle cx="140" cy="250" r="4" fill="#f472b6"/>

  <!-- Aesthetic Girlish Brand Typography -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="40" font-weight="800" letter-spacing="4" fill="#9d174d">CHARMZY</text>
  <text x="256" y="450" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#db2777">AESTHETIC JEWELRY • UNDER ₹299</text>
</svg>
